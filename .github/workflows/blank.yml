# This is a basic workflow name: Build Thinkwealth Smart Signal Pro EA

on:
  push:
    branches:
      - master
      - main
    paths:
      - '**.mq5'
      - '**.mqh'
      - '.github/workflows/blank.yml'
  workflow_dispatch:

jobs:
  build-ea:
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download MetaTrader 5
        shell: powershell
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          $installer = "$env:TEMP\mt5setup.exe"

          Write-Host "Downloading MetaTrader 5..."
          Invoke-WebRequest -Uri $url -OutFile $installer

          if (!(Test-Path $installer)) {
              Write-Error "MetaTrader 5 installer was not downloaded."
              exit 1
          }

          Write-Host "Installing MetaTrader 5..."
          Start-Process -FilePath $installer `
            -ArgumentList '/auto','/path:"C:\MT5"' `
            -Wait

      - name: Check MetaEditor
        shell: powershell
        run: |
          $metaEditor = "C:\MT5\metaeditor64.exe"

          if (!(Test-Path $metaEditor)) {
              Write-Error "MetaEditor was not found at $metaEditor"
              exit 1
          }

          Write-Host "MetaEditor found:"
          Write-Host $metaEditor

      - name: Find MQL5 source files
        shell: powershell
        run: |
          Write-Host "Searching for MQ5 files..."

          $files = Get-ChildItem `
            -Path "${{ github.workspace }}" `
            -Filter "*.mq5" `
            -Recurse `
            -File

          if ($files.Count -eq 0) {
              Write-Error "No .mq5 source file was found in the repository."
              exit 1
          }

          foreach ($file in $files) {
              Write-Host "Found: $($file.FullName)"
          }

      - name: Compile MQL5 EA
        shell: powershell
        run: |
          $metaEditor = "C:\MT5\metaeditor64.exe"

          $files = Get-ChildItem `
            -Path "${{ github.workspace }}" `
            -Filter "*.mq5" `
            -Recurse `
            -File

          foreach ($file in $files) {

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "Compiling: $($file.FullName)"
              Write-Host "=========================================="

              & $metaEditor "/compile:$($file.FullName)" /log

              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Compilation failed for $($file.Name)"
                  exit 1
              }

              Write-Host "Compilation command completed for $($file.Name)"
          }

      - name: Check compiled EX5 files
        shell: powershell
        run: |
          $files = Get-ChildItem `
            -Path "${{ github.workspace }}" `
            -Filter "*.ex5" `
            -Recurse `
            -File

          if ($files.Count -eq 0) {
              Write-Error "No .ex5 file was created. Check the compilation errors."
              exit 1
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "COMPILED EX5 FILES"
          Write-Host "=========================================="

          foreach ($file in $files) {
              Write-Host $file.FullName
          }

      - name: Upload compiled EX5
        uses: actions/upload-artifact@v4
        with:
          name: Thinkwealth-Smart-Signal-Pro-EA-EX5
          path: |
            **/*.ex5
          if-no-files-found: error
          retention-days: 30

      - name: Upload source MQ5
        uses: actions/upload-artifact@v4
        with:
          name: Thinkwealth-Smart-Signal-Pro-EA-Source
          path: |
            **/*.mq5
            **/*.mqh
          if-no-files-found: warn
          retention-days: 30 help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
